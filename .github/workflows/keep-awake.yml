name: Keep Streamlit app awake

# Streamlit Community Cloud puts an app to sleep after a few days of no
# traffic. This workflow pings the app on a schedule so the inactivity
# timer keeps resetting and the app never goes to sleep.

on:
  schedule:
    # Every 6 hours (times are UTC). Cron: minute hour day month weekday
    - cron: "0 */6 * * *"
  # Lets you trigger a ping manually from the Actions tab to test it.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          echo "Pinging Streamlit app..."
          # -s  : silent (no progress bar)
          # -S  : still show errors when silent
          # --retry: retry transient failures a few times
          # NOTE: no -L (don't follow redirects). Streamlit answers a
          #   sleeping app with a 303 that loops back on itself; following
          #   it hits curl's 50-redirect cap and fails with exit 47. The
          #   request itself is enough to reset the inactivity timer.
          # NOTE: no -f either, so a 3xx wake-up redirect isn't treated as
          #   an error. We ping the health endpoint, which returns 200.
          curl -sS --retry 3 --retry-delay 10 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://speech2summary-gk.streamlit.app/_stcore/health"
